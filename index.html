<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FilmCurator — Melhores do Século XXI</title>
  <style>
    :root {
      --bg: #0e0f13;
      --panel: #16181f;
      --panel-2: #1c1f28;
      --line: #2a2e3a;
      --txt: #e8eaf0;
      --muted: #9aa0b0;
      --accent: #f5c518;
      --accent-2: #6ea8fe;
      --gua: #e0533d;
      --nyt: #4a90d9;
      --both: #f5c518;
      --radius: 12px;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--txt);
      font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif
    }

    a {
      color: var(--accent-2)
    }

    header {
      padding: 22px 20px 10px;
      max-width: 1200px;
      margin: 0 auto
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: .3px
    }

    h1 svg {
      fill: var(--accent);
      vertical-align: -5px;
      margin-right: 8px
    }

    h1 span {
      color: var(--accent)
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px
    }

    .layout {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 60px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 22px;
      align-items: start
    }

    @media(max-width:820px) {
      .layout {
        grid-template-columns: 1fr
      }
    }

    .filters {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      position: sticky;
      top: 14px
    }

    @media(max-width:820px) {
      .filters {
        position: static
      }
    }

    .filters h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: var(--muted);
      margin: 0 0 6px
    }

    .fgroup {
      margin-bottom: 16px
    }

    .fgroup:last-child {
      margin-bottom: 0
    }

    .foot {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: var(--bg);
      border-top: 1px solid var(--line);
      padding: 6px 14px;
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .foot a {
      color: var(--muted);
      text-decoration: none
    }

    .foot a:hover {
      color: var(--accent-2)
    }

    .foot .updated {
      white-space: nowrap
    }

    @media(max-width:820px) {
      .foot {
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
    }

    label.fld {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 5px
    }

    input[type=text],
    select {
      width: 100%;
      background: var(--panel-2);
      color: var(--txt);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 14px
    }

    input[type=text]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent-2)
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      cursor: pointer;
      user-select: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12.5px
    }

    .chip.on {
      background: var(--accent);
      color: #111;
      border-color: var(--accent);
      font-weight: 600
    }

    .range {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .range input {
      flex: 1
    }

    .dualrange {
      position: relative;
      height: 26px;
      margin-top: 2px
    }

    .dr-track,
    .dr-fill {
      position: absolute;
      top: 11px;
      height: 4px;
      border-radius: 2px
    }

    .dr-track {
      left: 0;
      right: 0;
      background: var(--line)
    }

    .dr-fill {
      background: var(--accent-2)
    }

    .dualrange input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 26px;
      margin: 0;
      background: none;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none
    }

    .dualrange input::-webkit-slider-runnable-track {
      height: 26px;
      background: none;
      border: none
    }

    .dualrange input::-moz-range-track {
      height: 26px;
      background: none;
      border: none
    }

    .dualrange input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      pointer-events: auto;
      width: 16px;
      height: 16px;
      margin-top: 5px;
      border-radius: 50%;
      background: var(--accent-2);
      border: 2px solid var(--bg);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .5)
    }

    .dualrange input::-moz-range-thumb {
      pointer-events: auto;
      width: 16px;
      height: 16px;
      border: 2px solid var(--bg);
      border-radius: 50%;
      background: var(--accent-2);
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .5)
    }

    .rangeval {
      font-size: 12px;
      color: var(--muted);
      min-width: 70px;
      text-align: right
    }

    .reset {
      width: 100%;
      margin-top: 4px;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      font-size: 13px
    }

    .reset:hover {
      color: var(--txt);
      border-color: var(--accent-2)
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap
    }

    .count {
      color: var(--muted);
      font-size: 13px
    }

    .count b {
      color: var(--txt)
    }

    .sortwrap {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .sortwrap select {
      width: auto
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
      overflow: hidden;
      align-items: start;
      display: grid;
      column-gap: 18px;
      row-gap: 10px;
      grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.5fr);
      grid-template-areas: "poster body synopsis"
    }

    .card {
      cursor: pointer
    }

    .card:hover {
      border-color: #3a4050
    }

    .poster {
      grid-area: poster;
      align-self: start;
      width: 100%;
      aspect-ratio: 2/3;
      border-radius: 8px;
      object-fit: cover;
      background: var(--panel-2);
      border: 1px solid var(--line)
    }

    .poster.none {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      padding: 6px
    }

    .cbody {
      grid-area: body;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .csyn {
      grid-area: synopsis;
      min-width: 0
    }

    .synopsis {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5
    }

    @media(max-width:600px) {
      .card {
        grid-template-columns: 1fr;
        grid-template-areas: "poster" "body" "synopsis"
      }

      .poster {
        width: unset
      }
    }

    .card .rankbar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, var(--accent), transparent)
    }

    .ct {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.25
    }

    .cpt {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: -4px
    }

    .meta {
      font-size: 12.5px;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px
    }

    .meta b {
      color: var(--txt);
      font-weight: 500
    }

    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 2px
    }

    .b {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600
    }

    .b.gua {
      background: rgba(224, 83, 61, .18);
      color: #ff8c76;
      border: 1px solid rgba(224, 83, 61, .4)
    }

    .b.nyt {
      background: rgba(74, 144, 217, .18);
      color: #8fc0ff;
      border: 1px solid rgba(74, 144, 217, .4)
    }

    .b.bbc {
      background: rgba(155, 109, 196, .18);
      color: #c9a9e6;
      border: 1px solid rgba(155, 109, 196, .42)
    }

    .b.both {
      display: block;
      padding: 0;
      border-radius: 0;
      background: none;
      border: none;
      color: var(--accent)
    }

    .b.pts {
      background: var(--accent);
      color: #111
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 5px
    }

    .gtag {
      font-size: 11px;
      background: rgba(110, 168, 254, .12);
      border: 1px solid rgba(110, 168, 254, .32);
      color: var(--accent-2);
      padding: 2px 8px;
      border-radius: 6px
    }

    .plats {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: auto;
      padding-top: 6px
    }

    .plat {
      font-size: 11px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 2px 8px;
      border-radius: 6px
    }

    .plat.none {
      color: #c77
    }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      color: var(--muted);
      padding: 50px 0
    }
  </style>
</head>

<body>
  <header>
    <h1><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="m160-800 80 160h120l-80-160h80l80 160h120l-80-160h80l80 160h120l-80-160h120q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800Zm0 240v320h640v-320H160Zm0 0v320-320Z"/></svg>Film<span>Curator</span></h1>
    <div class="sub">Os melhores filmes do século XXI reunidos de <b>Guardian</b> (2019), <b>Times</b> (2025) e
      <b>BBC</b> (2016), ordenados por pontos. Onde assistir no Brasil.</div>
  </header>

  <div class="layout">
    <aside class="filters">
      <div class="fgroup">
        <h2>Buscar</h2>
        <input type="text" id="q" placeholder="Título ou diretor…" autocomplete="off">
      </div>

      <div class="fgroup">
        <h2>Lista</h2>
        <div class="chips" id="listChips"><!-- gerado das fontes em app.js --></div>
      </div>

      <div class="fgroup">
        <label class="fld" for="platform">Plataforma (BR)</label>
        <select id="platform">
          <option value="">Todas</option>
        </select>
      </div>

      <div class="fgroup">
        <label class="fld" for="country">País de origem</label>
        <select id="country">
          <option value="">Todos</option>
        </select>
      </div>

      <div class="fgroup">
        <label class="fld" for="director">Diretor</label>
        <select id="director">
          <option value="">Todos</option>
        </select>
      </div>

      <div class="fgroup">
        <label class="fld" for="genre">Gênero</label>
        <select id="genre">
          <option value="">Todos</option>
        </select>
      </div>

      <div class="fgroup">
        <label class="fld">Ano do filme</label>
        <div class="dualrange">
          <div class="dr-track"></div>
          <div class="dr-fill" id="yearFill"></div>
          <input type="range" id="yearMin" step="1">
          <input type="range" id="yearMax" step="1">
        </div>
        <div class="rangeval" id="yearVal" style="text-align:left">—</div>
      </div>

      <div class="fgroup">
        <label class="fld">Duração máxima</label>
        <div class="range">
          <input type="range" id="dur" min="80" max="321" value="321" step="1">
          <span class="rangeval" id="durVal">até 321 min</span>
        </div>
      </div>

      <div class="fgroup">
        <label class="fld"><input type="checkbox" id="onlyStream"> Só com streaming no BR</label>
      </div>

      <button class="reset" id="reset">Limpar filtros</button>
    </aside>

    <main>
      <div class="toolbar">
        <div class="count"><b id="n">0</b> filmes</div>
        <div class="sortwrap">
          <span class="count">Ordenar:</span>
          <select id="sort">
            <option value="score">Pontos (soma das listas)</option>
            <option value="gua">Rank Guardian</option>
            <option value="nyt">Rank Times</option>
            <option value="bbc">Rank BBC</option>
            <option value="yearDesc">Ano (mais recente)</option>
            <option value="yearAsc">Ano (mais antigo)</option>
            <option value="titleOrig">Título (A–Z)</option>
            <option value="durAsc">Duração (menor)</option>
            <option value="durDesc">Duração (maior)</option>
          </select>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <footer class="foot">
    <span class="updated" id="updated"></span>
    <span class="cright">© <a href="https://rafaortman.github.io/filmcurator/">Rafael Ortman</a> • 2026</span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>

</html>
